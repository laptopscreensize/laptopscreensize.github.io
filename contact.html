<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us – My Screen Size</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
  <style>
    /* Specific styles for contact form integration */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .form-group input, .form-group textarea {
      background: var(--bg);
      border: 1px solid var(--border-2);
      color: var(--text);
      padding: 14px;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      outline: none;
      transition: border-color var(--transition);
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--accent);
    }
    .contact-section {
      padding: 120px 0;
      background: var(--bg-2);
    }
  </style>
</head>
<body>

  <div id="header-root"></div>

  <main>
    <section class="contact-section">
      <div class="container">
        <div class="section-tag">Get in Touch</div>
        <h2 class="section-title">Support & <span class="gradient-text">Feedback</span></h2>
        <p class="section-sub">Have a feature request or found a bug? Drop us a message below.</p>

        <div class="det-card" style="max-width: 700px; margin: 0 auto; padding: 40px;">
          <form class="contact-form">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" placeholder="Your Name" required>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="email@example.com" required>
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" rows="5" placeholder="How can we help?" required></textarea>
            </div>
            <button type="submit" class="btn-primary" style="margin-top: 10px;">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="components/header.js"></script>
  <script src="components/footer.js"></script>
</body>
</html>
